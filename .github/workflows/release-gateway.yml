name: Gateway image

# The gateway image tracks UPSTREAM KiroCrew, not this operator's version, so it
# releases on its own cadence and the operator's v* tags stay independent. A
# Dependabot PR bumping a base digest in images/gateway/Containerfile is the
# normal trigger: merging it to main republishes the image, so a new upstream
# KiroCrew release reaches crews without an operator release.
#
# A pull request BUILDS BUT DOES NOT PUBLISH. That is not a release running in a
# PR — it is the only way to know a base bump is safe before it reaches main, and
# it has already earned its keep: Dependabot's node 22 -> 26 bump failed here on a
# missing libatomic instead of breaking every crew's image. The job name says
# which mode it is in, and the login and push steps are skipped entirely.
on:
  push:
    branches:
      - main
    paths:
      - images/gateway/**
      - .github/workflows/release-gateway.yml
  pull_request:
    paths:
      - images/gateway/**
      - .github/workflows/release-gateway.yml
  # Weekly, to pick up a moved upstream tag even if Dependabot has not opened a
  # PR yet, and to catch a base whose digest was retagged in place.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kiro-crew-gateway

jobs:
  gateway:
    # Say plainly which mode this run is in, so a PR check never claims to publish.
    name: ${{ github.event_name == 'pull_request' && 'Verify (no publish)' || 'Build and publish' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version the image is pegged to comes from the base image itself, not
      # from anything we maintain by hand, so the published tag says which
      # upstream release it actually carries. Read from the config's env rather
      # than a label: upstream sets KIROCREW_VERSION but no image.version label,
      # which is why an earlier build published the useless tag "kirocrew-unknown".
      - name: Resolve the upstream KiroCrew version
        id: upstream
        run: |
          set -euo pipefail
          BASE="$(grep -oE '^FROM ghcr\.io/kirodotdev/kirocrew[^ ]+' images/gateway/Containerfile | sed 's/^FROM //')"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          # Shell-only on purpose: the Env entries are quoted JSON strings, so a
          # grep finds the value without needing a parser embedded in this YAML.
          VERSION="$(docker buildx imagetools inspect "${BASE}" --format '{{json .Image}}' \
            | tr ',' '\n' \
            | grep -oE 'KIROCREW_VERSION=[^"]+' \
            | head -1 | cut -d= -f2 || true)"
          if [ -z "${VERSION}" ]; then
            echo "::warning::Could not read KIROCREW_VERSION from ${BASE}; tagging by commit only"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Pegged to upstream KiroCrew ${VERSION:-<unknown>} (${BASE})"

      # Tags are computed here so the publish step stays declarative, and so an
      # unreadable upstream version omits that tag instead of publishing a lie.
      - name: Compute tags
        id: tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          {
            echo "list<<EOF"
            echo "${IMG}:latest"
            [ -n "${{ steps.upstream.outputs.version }}" ] && echo "${IMG}:kirocrew-${{ steps.upstream.outputs.version }}"
            echo "${IMG}:sha-${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # One build per run. A PR builds a single arch and loads it locally so the
      # scan below has something to read; paying for the arm64 leg to verify a
      # base bump buys nothing. A publish builds both arches and pushes.
      - name: Verify the image builds
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: images/gateway/Containerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: images/gateway/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scanning lives here rather than in security.yml so the image is built
      # ONCE per event. On a PR it scans what was just loaded; on a publish it
      # scans the pushed image by its immutable commit tag.
      #
      # Reports without failing. Nearly every finding belongs to upstream's base
      # or to Debian, and blocking on a CVE we cannot patch would only teach
      # everyone to ignore a red build. The fix arrives as a Dependabot base bump.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ github.event_name == 'pull_request' && format('{0}:scan', env.IMAGE_NAME) || format('{0}/{1}/{2}:sha-{3}', env.REGISTRY, github.repository_owner, env.IMAGE_NAME, github.sha) }}
          scan-type: image
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Summarise
        run: |
          {
            echo "### Gateway image"
            echo
            echo "Upstream KiroCrew: \`${{ steps.upstream.outputs.version || 'unknown' }}\`"
            echo
            echo "Base: \`${{ steps.upstream.outputs.base }}\`"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo
              echo "Verification build only (linux/amd64) — nothing published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
