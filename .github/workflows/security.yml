name: Security

# Now that the repo is public, GitHub's code scanning and Dependabot alerts are
# free, so findings land in the Security tab rather than only in a log. Three
# distinct classes of problem, because none of these subsumes another:
#
#   CodeQL       — bugs in the operator's own Go code
#   govulncheck  — known CVEs in the modules it imports, filtered to the ones
#                  actually reachable from our call graph
#   Trivy config — Kubernetes misconfiguration in the chart and manifests we ship
#   Trivy image  — OS and language CVEs in the gateway image's four bases
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # A dependency becomes vulnerable while the code sits untouched, so a scan
    # that only runs on push would go stale on a quiet week.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.0
        with:
          languages: go
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.39.0

      - name: Analyze
        uses: github/codeql-action/analyze@v4.39.0

  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # This one DOES fail the build. Unlike a base-image CVE, a reachable vuln
      # in a module we import is ours to fix by bumping it.
      - name: Run govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  config:
    name: Manifest misconfiguration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Scans the Helm chart and kustomize manifests this repo ships. Note the
      # deny-all NetworkPolicy and the deliberately absent CPU limits are design
      # decisions documented in the README, so expect findings there and judge
      # them rather than "fixing" them.
      - name: Scan manifests with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4.39.0
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
