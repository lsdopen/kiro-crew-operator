    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KiroCrew is a single-owner Kiro Crew instance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KiroCrewSpec defines the desired state of a Kiro Crew instance.
            properties:
              aws:
                description: AWS configures the instance's AWS identity.
                properties:
                  roleARN:
                    description: |-
                      RoleARN is annotated onto the ServiceAccount for IRSA, giving the crew
                      (not the operator) its AWS permissions.
                    type: string
                type: object
              gateway:
                description: Gateway configures the Kiro Crew gateway container.
                properties:
                  image:
                    description: Image is the Kiro Crew gateway image.
                    type: string
                  imagePullPolicy:
                    description: ImagePullPolicy for the gateway container.
                    type: string
                  resources:
                    description: |-
                      Resources overrides the resolved Size tier. Set this only to escape the
                      tiers; normally leave it empty and use spec.size.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              mcpConfigRef:
                description: |-
                  MCPConfigRef names a ConfigMap holding mcp-servers.json, mounted so MCP
                  endpoints can change with a helm upgrade instead of an image rebuild.
                type: string
              owner:
                description: |-
                  Owner is the tailnet identity that owns this crew, e.g. "someone@example.com".

                  This is the instance's identity boundary. The crew holds this person's own
                  vaulted Kiro token, so their agent activity draws down their credits, and
                  they are the only human who should reach it. Access is enforced by the
                  tailnet: they authenticate the node, so autogroup:self admits them and
                  nobody else.
                minLength: 3
                type: string
              schedule:
                description: Schedule starts and stops the crew on a time window.
                properties:
                  down:
                    description: Down is a 5-field cron expression for when the crew
                      stops, e.g. "0 18 * * 1-5".
                    minLength: 9
                    type: string
                  timezone:
                    default: UTC
                    description: Timezone is the IANA zone the cron expressions are
                      evaluated in.
                    type: string
                  up:
                    description: Up is a 5-field cron expression for when the crew
                      starts, e.g. "0 8 * * 1-5".
                    minLength: 9
                    type: string
                required:
                - down
                - up
                type: object
              size:
                default: light
                description: Size is the resource tier for this instance.
                enum:
                - mini
                - light
                - development
                - power
                type: string
              startedAt:
                description: |-
                  StartedAt is an Up event set by the console's Start. With a schedule the
                  latest of the last Up, last Down and StartedAt wins, so the next scheduled
                  Down stops the crew again. Without a schedule it is ignored.
                format: date-time
                type: string
              storage:
                description: Storage configures the instance's persistent volume.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Size of the PersistentVolumeClaim. Defaults to the
                      Size tier's storage.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: |-
                      StorageClassName to bind. Empty uses the cluster default. Must resolve to
                      block storage (e.g. gp3), never a network filesystem.
                    type: string
                type: object
              suspend:
                description: |-
                  Suspend stops the crew (StatefulSet replicas 0) and overrides schedule.
                  The PVC is kept, so identity, tailnet state and the Kiro token survive.
                type: boolean
              tailscale:
                description: Tailscale configures how the instance joins the tailnet.
                properties:
                  hostname:
                    description: |-
                      Hostname is the tailnet node name, and therefore the MagicDNS name the
                      desktop app SSHes to. Defaults to "kiro-crew-<instance>".
                    type: string
                type: object
            required:
            - owner
            type: object
          status:
            description: KiroCrewStatus reports the observed state of a Kiro Crew
              instance.
            properties:
              conditions:
                description: Conditions holds the latest observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dashboardURL:
                description: |-
                  DashboardURL is always empty now: the dashboard is not published over
                  HTTPS, and owners reach the crew by SSH to its tailnet hostname.
                type: string
              nextTransition:
                description: NextTransition is when spec.schedule next starts or stops
                  the crew.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation this status
                  reflects.
                format: int64
                type: integer
              suspended:
                description: |-
                  Suspended is true while the crew is intentionally stopped, by spec.suspend
                  or by being outside spec.schedule.
                type: boolean
              tailnetLoginURL:
                description: |-
                  TailnetLoginURL is the URL the owner opens to authenticate this node, once.

                  Surfaced here to break a bootstrap cycle: the node is not on the tailnet
                  until it is authenticated, so the URL cannot be delivered over the tailnet
                  it is trying to join. It is cleared once the node is joined.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
