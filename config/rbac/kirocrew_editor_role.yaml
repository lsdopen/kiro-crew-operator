# This rule is not used by the project kiro-crew-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the kirocrew.lsdopen.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kiro-crew-operator
    app.kubernetes.io/managed-by: kustomize
  name: kirocrew-editor-role
rules:
- apiGroups:
  - kirocrew.lsdopen.io
  resources:
  - kirocrews
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kirocrew.lsdopen.io
  resources:
  - kirocrews/status
  verbs:
  - get
