{{- if and .Values.console.enabled .Values.console.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kiro-crew-operator.console.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kiro-crew-operator.console.labels" . | nindent 4 }}
  {{- with .Values.console.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.console.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.console.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.console.ingress.host | quote }}
    {{- with .Values.console.ingress.tls.secretName }}
    secretName: {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
  - host: {{ .Values.console.ingress.host | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "kiro-crew-operator.console.name" . }}
            port:
              name: http
{{- end }}
