{{- if and .Values.console.enabled .Values.console.networkPolicy.enabled }}
{{- $np := .Values.console.networkPolicy }}
# Ingress only from console.networkPolicy.ingressFrom. Egress only
# to DNS, the API server and HTTPS, which the OIDC issuer needs: its addresses are
# not stable, so port 443 is open to any address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kiro-crew-operator.console.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kiro-crew-operator.console.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kiro-crew-operator.console.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    {{- toYaml (required "console.networkPolicy.ingressFrom is required" $np.ingressFrom) | nindent 4 }}
    ports:
    - port: http
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ $np.dnsNamespace }}
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    {{- range $np.apiServerCIDRs }}
    - ipBlock:
        cidr: {{ . }}
    {{- else }}
    - ipBlock:
        cidr: 0.0.0.0/0
    {{- end }}
    ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 443
      protocol: TCP
{{- end }}
