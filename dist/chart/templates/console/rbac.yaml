{{- if .Values.console.enabled }}
{{- $ns := .Values.console.crewNamespace }}
# Least privilege. Accounts are cluster-scoped, so the ClusterRole carries only
# them (read, plus create for self sign-up). Crews are read-only. Requests also get
# create (new request), patch (decision) and delete (cancel). Both are granted in
# console.crewNamespace alone when it is set. Nothing else: no Secrets, no
# pods/exec, no update, and no write on crews.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kiro-crew-operator.console.name" . }}
  labels:
    {{- include "kiro-crew-operator.console.labels" . | nindent 4 }}
rules:
- apiGroups: ["kirocrew.lsdopen.io"]
  resources: ["kirocrewaccounts"]
  verbs: ["get", "list", "watch", "create"]
{{- if not $ns }}
# crewNamespace is empty: the console watches crews and requests in every namespace.
- apiGroups: ["kirocrew.lsdopen.io"]
  resources: ["kirocrews"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kirocrew.lsdopen.io"]
  resources: ["kirocrewrequests"]
  verbs: ["get", "list", "watch", "create", "patch", "delete"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kiro-crew-operator.console.name" . }}
  labels:
    {{- include "kiro-crew-operator.console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kiro-crew-operator.console.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "kiro-crew-operator.console.name" . }}
  namespace: {{ .Release.Namespace }}
{{- if $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kiro-crew-operator.console.name" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "kiro-crew-operator.console.labels" . | nindent 4 }}
rules:
- apiGroups: ["kirocrew.lsdopen.io"]
  resources: ["kirocrews"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kirocrew.lsdopen.io"]
  resources: ["kirocrewrequests"]
  verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kiro-crew-operator.console.name" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "kiro-crew-operator.console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kiro-crew-operator.console.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "kiro-crew-operator.console.name" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
