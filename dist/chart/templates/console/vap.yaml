{{- if and .Values.console.enabled .Values.console.broker.enabled }}
{{- $ns := .Values.console.crewNamespace }}
# Narrows the console's pods/exec grant to the one sign-in command. Needs
# Kubernetes 1.30+. Only the console ServiceAccount is constrained; every other
# caller is untouched. RBAC cannot see the command, so this is the only control.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "kiro-crew-operator.console.name" . }}-exec
  labels:
    {{- include "kiro-crew-operator.console.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CONNECT"]
      resources: ["pods/exec"]
  matchConditions:
  - name: console-service-account
    expression: "request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:{{ include "kiro-crew-operator.console.name" . }}'"
  validations:
  - expression: "has(object.container) && object.container == 'gateway' && object.command == ['kirocrew', 'token', '--ttl', '5m'] && !(has(object.stdin) && object.stdin) && !(has(object.tty) && object.tty)"
    reason: Forbidden
    message: "the console may only exec 'kirocrew token --ttl 5m' in the gateway container, without stdin or a tty"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "kiro-crew-operator.console.name" . }}-exec
  labels:
    {{- include "kiro-crew-operator.console.labels" . | nindent 4 }}
spec:
  policyName: {{ include "kiro-crew-operator.console.name" . }}-exec
  validationActions: ["Deny"]
  {{- if $ns }}
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns }}
  {{- end }}
{{- end }}
