{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: kirocrewconfigs.kirocrew.lsdopen.io
spec:
  group: kirocrew.lsdopen.io
  names:
    kind: KiroCrewConfig
    listKind: KiroCrewConfigList
    plural: kirocrewconfigs
    singular: kirocrewconfig
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KiroCrewConfig is the Schema for the kirocrewconfigs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of KiroCrewConfig
            properties:
              allowedSizes:
                default:
                - mini
                - light
                - development
                - power
                description: AllowedSizes are the tiers the request form offers and
                  requests may use.
                items:
                  description: |-
                    Size is a named resource tier. Tiers mirror Kiro Crew's own cloud sizes, with
                    an extra "mini" below Light for users who only run single-threaded work.
                  enum:
                  - mini
                  - light
                  - development
                  - power
                  type: string
                maxItems: 4
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              defaultSize:
                default: light
                description: DefaultSize is preselected on the request form.
                enum:
                - mini
                - light
                - development
                - power
                type: string
              gateway:
                description: Gateway overrides the gateway image of every crew that
                  sets none.
                properties:
                  image:
                    description: Image is the full image reference, including its
                      tag.
                    maxLength: 512
                    pattern: ^\S*$
                    type: string
                type: object
              mcpConfigRef:
                description: MCPConfigRef names the ConfigMap used by crews whose
                  own mcpConfigRef is empty.
                maxLength: 253
                type: string
              mcpConfigs:
                description: |-
                  MCPConfigs are the ConfigMap names, in the crew namespace, an admin may
                  choose from when setting a crew's mcpConfigRef in the console.
                items:
                  maxLength: 253
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              tailscale:
                description: Tailscale overrides the tailscale sidecar image of every
                  crew that sets none.
                properties:
                  image:
                    description: Image is the full image reference, including its
                      tag.
                    maxLength: 512
                    pattern: ^\S*$
                    type: string
                type: object
            type: object
            x-kubernetes-validations:
            - message: defaultSize must be one of allowedSizes
              rule: self.defaultSize in self.allowedSizes
          status:
            description: status defines the observed state of KiroCrewConfig
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the only allowed name is default
          rule: self.metadata.name == 'default'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
