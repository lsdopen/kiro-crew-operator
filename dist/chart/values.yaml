## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    # Published by .github/workflows/release.yml on every v* tag. The bare
    # semver tag is what Chart.appVersion resolves to, so a plain
    # `helm install --version X.Y.Z` pulls the matching operator image.
    repository: ghcr.io/lsdopen/kiro-crew-operator
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration
##
webhook:
  enabled: false
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false


# Tailnet configuration.
#
# Crew pods join the tailnet as user-owned nodes: each instance's owner
# authenticates it once, interactively, which is what makes the tailnet's
# autogroup:self grant able to restrict a crew to exactly one person without a
# per-user ACL entry. The operator holds no Tailscale credential and writes no
# ACLs -- see docs/tailnet.md for the policy to apply once, by hand.
tailnet:
  # The tailnet's MagicDNS suffix, e.g. "example-tailnet.ts.net".
  # Required for the operator to report each instance's dashboard URL.
  domain: ""

## Management console (opt-in). A separate Deployment with its own
## ServiceAccount; it does not need the manager. See docs/design/console.md.
##
console:
  enabled: false

  replicas: 2

  image:
    # Published by .github/workflows/release.yml with the same tag as the operator.
    repository: ghcr.io/lsdopen/kiro-crew-console
    ## Image tag (defaults to Chart.appVersion if not set)
    # tag: ""
    pullPolicy: IfNotPresent

  # imagePullSecrets:
  #   - name: myregistrykey

  ## Namespace holding KiroCrews and KiroCrewRequests. The console gets read access
  ## to them in this namespace only. Empty watches them all, via a ClusterRole.
  crewNamespace: kiro-crews

  ## CIDRs of the ingress controller or load balancer. X-Forwarded-For is believed
  ## only from these peers, to rate limit by client IP. Empty uses the remote address.
  trustedProxies: []

  auth:
    ## Only "google" is implemented.
    provider: google
    issuerURL: https://accounts.google.com
    ## Required, e.g. https://console.example.com/auth/callback
    redirectURL: ""
    ## Workspace domains allowed to sign in, e.g. [example.com]. This is the only
    ## boundary on who gets an account. Empty refuses every login and the console
    ## refuses to start unless allowEmptyDomains is set.
    allowedDomains: []
    allowEmptyDomains: false
    ## Required. Secret with keys client-id, client-secret and cookie-key. It is
    ## created out of band and is never read from values. Name only, not a secret.
    ## cookie-key is base64 of at least 32 random bytes: openssl rand -base64 32
    ## e.g. existingSecret: kiro-crew-console-auth
    existingSecret: ""

  ## Exposure is the operator's choice: set class and annotations for a private or
  ## public ingress. SSO is the authentication step either way.
  ingress:
    enabled: false
    className: ""
    host: console.example.com
    annotations: {}
    tls:
      enabled: true
      secretName: ""

  ## Restrict the console pod's traffic. Off by default: it needs a CNI that
  ## enforces NetworkPolicy, and the right ingress namespace.
  networkPolicy:
    enabled: false
    ## Namespace of the ingress controller, allowed to reach the console. Behind an
    ## ALB in ip mode, traffic comes from the load balancer subnets instead: list
    ## them in console.trustedProxies, which are admitted as well.
    ingressNamespace: ingress-nginx
    ## Namespace of cluster DNS.
    dnsNamespace: kube-system
    ## CIDRs of the API server endpoints (kubectl get endpoints kubernetes). Empty
    ## allows ports 443 and 6443 to any address.
    apiServerCIDRs: []

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
