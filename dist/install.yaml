                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              mcpConfigRef:
                description: |-
                  MCPConfigRef names a ConfigMap holding mcp-servers.json, mounted so MCP
                  endpoints can change with a helm upgrade instead of an image rebuild.
                type: string
              owner:
                description: |-
                  Owner is the tailnet identity that owns this crew, e.g. "someone@example.com".

                  This is the instance's identity boundary. The crew holds this person's own
                  vaulted Kiro token, so their agent activity draws down their credits, and
                  they are the only human who should reach it. Access is enforced by the
                  tailnet: they authenticate the node, so autogroup:self admits them and
                  nobody else.
                minLength: 3
                type: string
              size:
                default: light
                description: Size is the resource tier for this instance.
                enum:
                - mini
                - light
                - development
                - power
                type: string
              storage:
                description: Storage configures the instance's persistent volume.
                properties:
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Size of the PersistentVolumeClaim. Defaults to the
                      Size tier's storage.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: |-
                      StorageClassName to bind. Empty uses the cluster default. Must resolve to
                      block storage (e.g. gp3), never a network filesystem.
                    type: string
                type: object
              tailscale:
                description: Tailscale configures how the instance joins the tailnet.
                properties:
                  hostname:
                    description: |-
                      Hostname is the tailnet node name, and therefore the MagicDNS name the
                      desktop app connects to. Defaults to "kiro-crew-<instance>".
                    type: string
                  image:
                    description: Image is the tailscale sidecar image.
                    type: string
                type: object
            required:
            - owner
            type: object
          status:
            description: KiroCrewStatus reports the observed state of a Kiro Crew
              instance.
            properties:
              conditions:
                description: Conditions holds the latest observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
